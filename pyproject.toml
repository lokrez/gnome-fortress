[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-fortress"
version = "0.1.0"
description = "Deterministic, observable artificial-life experiment"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gnome-fortress = "gnome_fortress.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
